<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Audit</title>
<style>
  :root {
    --text: #1d1d1f;
    --secondary: #6e6e73;
    --panel: rgba(245, 245, 247, .92);
    --card: #ffffff;
    --field: rgba(120, 120, 128, .16);
    --hairline: rgba(0, 0, 0, .12);
    --blue: #0071e3;
    --green: #1e7e34;
    --red: #d92d20;
    --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --glass: rgba(255, 255, 255, .78);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #e8e8ed; color: var(--text); font-family: var(--sans);
    font-size: 13px; -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(0, 122, 255, .22); }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; border-radius: 6px; }
  button { font-family: var(--sans); }
  button svg { display: block; }

  #view { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }

  .glass { background: var(--glass);
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(0, 0, 0, .08); box-shadow: 0 8px 28px rgba(0, 0, 0, .14); }

  /* --- compact top search pill --- */
  #addr { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 30;
    display: flex; align-items: center; gap: 6px; height: 34px; padding: 3px 3px 3px 12px;
    width: min(440px, calc(100vw - 120px)); border-radius: 17px; }
  #addr input { flex: 1; min-width: 0; border: 0; background: transparent;
    font-size: 12.5px; color: var(--text); caret-color: var(--blue); text-align: center; }
  #addr input:focus { outline: none; }
  #addr input::placeholder { color: var(--secondary); }
  #go { border: 0; border-radius: 14px; height: 28px; padding: 0 12px; cursor: pointer;
    background: var(--blue); color: #fff; font-size: 12.5px; font-weight: 600; }
  #go:hover { filter: brightness(1.07); }
  #go:active { filter: brightness(.93); }

  #warn { display: none; position: fixed; top: 52px; left: 50%; transform: translateX(-50%);
    z-index: 30; width: min(440px, calc(100vw - 120px)); padding: 8px 14px;
    border-radius: 12px; font-size: 12.5px; text-align: center; }

  /* --- tool pill (right edge, vertically centered) --- */
  #rail { position: fixed; right: 12px; top: 50%; transform: translateY(-50%); z-index: 30;
    display: flex; flex-direction: column; gap: 2px; padding: 6px;
    border-radius: 20px; }

  /* --- comment pills (left edge, one line each) --- */
  #pills { position: fixed; z-index: 29; left: 12px; top: 54px;
    display: flex; flex-direction: column; gap: 8px;
    width: min(300px, calc(100vw - 120px)); max-height: calc(100vh - 70px);
    overflow-y: auto; padding: 10px;
    border: 1px solid #8e8e93; border-radius: 18px;
    background: rgba(99, 99, 102, .55);
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    box-shadow: 0 8px 28px rgba(0, 0, 0, .14); }
  #pills:empty { display: none; }
  .pill { border-radius: 12px; padding: 10px; cursor: pointer;
    background: #fff;
    border: 1px solid #fff;
    animation: pop .18s cubic-bezier(.2,.9,.25,1); }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .pill .line { display: flex; align-items: center; gap: 8px; }
  .pill .dot { flex: none; width: 8px; height: 8px; border-radius: 4px; }
  .pill .txt { flex: 1; min-width: 0; font-size: 12.5px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .pill .x { flex: none; border: 0; background: transparent; color: var(--red);
    font-size: 15px; font-weight: 700; line-height: 1; cursor: pointer;
    width: 24px; height: 24px; border-radius: 8px; }
  .pill .x:hover { background: rgba(217, 45, 32, .12); }
  .pill .full { display: none; margin-top: 6px; font-size: 12.5px; line-height: 1.5;
    white-space: pre-wrap; }
  .pill .meta { display: none; margin-top: 4px; font-size: 10.5px; font-family: var(--mono);
    color: var(--secondary); word-break: break-all; }
  .pill.open .full, .pill.open .meta { display: block; }
  #rail button { position: relative; width: 36px; height: 36px; border: 0; border-radius: 12px;
    background: transparent; color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center; }
  #rail button:hover { background: var(--field); }
  #rail button.on { background: var(--blue); color: #fff; }
  #rail hr { border: 0; border-top: 1px solid var(--hairline); margin: 3px 6px; }
  #toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 31;
    padding: 8px 18px; border-radius: 16px; font-size: 12.5px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  #toast.show { opacity: 1; }
  #pickHint { display: none; position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 30; padding: 7px 16px; border-radius: 16px;
    font-size: 12.5px; font-weight: 600; }
  #pickHint.show { display: block; }

  /* comments live in #pills (left) — no sidebar */

  #editor { display: none; position: fixed; z-index: 31;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(340px, calc(100vw - 60px)); padding: 14px; border-radius: 14px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, .22); }
  #editor.show { display: block; animation: edrop .25s cubic-bezier(.2,.9,.25,1); }
  @keyframes edrop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  #editor .rule-label { font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .04em; color: var(--secondary); margin-bottom: 6px; }

  .note { background: var(--card); border: 1px solid var(--hairline); border-radius: 10px;
    padding: 8px 10px; }
  .note .sel { font-size: 10.5px; font-family: var(--mono); word-break: break-all; }
  .note .ctx { font-size: 11px; color: var(--secondary); margin-top: 2px; }
  textarea, select { width: 100%; padding: 7px 9px; border: 1px solid var(--hairline);
    border-radius: 8px; font-size: 12.5px; background: #fff; color: var(--text);
    caret-color: var(--blue); }
  textarea::placeholder { color: var(--secondary); }
  textarea { min-height: 64px; resize: vertical; line-height: 1.5; }
  .erow { display: flex; gap: 8px; margin-top: 8px; }
  .erow button { flex: 1; padding: 7px; border-radius: 8px; border: 0; cursor: pointer;
    font-size: 12.5px; font-weight: 600; }
  .esave { background: var(--blue); color: #fff; }
  .esave:hover { filter: brightness(1.07); }
  .ecancel { background: var(--field); color: var(--text); }
</style>
</head>
<body>
<iframe id="view" title="audited site"></iframe>

<div id="addr" class="glass">
  <input id="url" placeholder="Search or enter website address" />
  <button id="go">Go</button>
</div>
<div id="warn" class="glass"></div>

<nav id="rail" class="glass" aria-label="Audit tools">
  <button id="pickBtn" title="Select element (Mark)" aria-label="Select element">
    <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8" cy="8" r="5.2"/><path d="M8 0.8v3M8 12.2v3M0.8 8h3M12.2 8h3"/></svg>
  </button>
  <hr />
  <button id="copyBtn" title="Copy notes as JSON" aria-label="Copy notes as JSON">
    <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5h-6a1 1 0 0 0-1 1v6"/></svg>
  </button>
  <button id="clearBtn" title="Clear notes on this page" aria-label="Clear notes on this page">
    <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 4h11M6.5 4V2.5h3V4M4 4l.7 9.5h6.6L12 4M6.5 7v4M9.5 7v4"/></svg>
  </button>
</nav>
<div id="pickHint" class="glass">Click any element in the page — ESC to stop</div>

<div id="pills" aria-live="polite"></div>

<div id="editor" class="glass">
    <div class="rule-label">New annotation</div>
    <select id="eSev">
      <option value="bug">Bug</option>
      <option value="ui">Comment</option>
    </select>
    <div style="height:8px"></div>
    <textarea id="eText" placeholder="Describe the change…"></textarea>
    <div class="erow">
      <button class="esave" id="eSave">Add</button>
      <button class="ecancel" id="eCancel">Cancel</button>
    </div>
  </div>
<div id="toast" class="glass"></div>

<script>
const $ = (s) => document.querySelector(s);
const view = $("#view");
const uid = () => "n_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
const b64enc = (s) => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const SEV_NAME = { ui: "Comment", bug: "Bug", copy: "Copy", a11y: "Accessibility", question: "Question" };
const SEV_COLOR = { ui: "#0071e3", bug: "#d92d20", copy: "#b07d10", a11y: "#7d3fd1", question: "#6e6e73" };
// NOTE: never use `x instanceof Element` here — targets live in the iframe's
// realm, so cross-realm instanceof is always false. nodeType === 1 instead.
const isElem = (n) => !!n && n.nodeType === 1;

let target = new URLSearchParams(location.search).get("url") || "http://localhost:3000";
let notes = [];
try { notes = JSON.parse(localStorage.getItem("__audit_notes_v1") || "[]"); } catch { notes = []; }
const persist = () => { try { localStorage.setItem("__audit_notes_v1", JSON.stringify(notes)); } catch {} };

// --- proxy helpers ---
function proxySrc(t) {
  t = t.replace(/\/+$/, "");
  return "/p/" + b64enc(t) + "/";
}
function load(t) {
  target = t.replace(/\/+$/, "");
  $("#url").value = target;
  history.replaceState(null, "", "/audit?url=" + encodeURIComponent(target));
  // Register as the fallback-proxy target so root-absolute assets + api
  // calls (/api/..., /@vite/...) resolve against the audited site.
  fetch("/api/target", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url: target }) }).catch(() => {});
  view.src = proxySrc(target);
}
$("#go").onclick = () => { const u = $("#url").value.trim(); if (u) load(u); };
$("#url").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#go").click(); });

// --- picking inside the (same-origin, proxied) iframe ---
function cssPath(el, doc) {
  if (!el || el === doc.body || el === doc.documentElement) return "body";
  if (el.id) return "#" + CSS.escape(el.id);
  const parts = [];
  let cur = el;
  while (cur && cur !== doc.body && cur !== doc.documentElement && parts.length < 6) {
    let sel = (cur.tagName || "el").toLowerCase();
    if (cur.className && typeof cur.className === "string") {
      const cls = cur.className.trim().split(/\s+/).slice(0, 2).map((c) => CSS.escape(c)).join(".");
      if (cls) sel += "." + cls;
    }
    const parent = cur.parentElement;
    if (parent) {
      const sibs = [...parent.children].filter((s) => s.tagName === cur.tagName);
      if (sibs.length > 1) sel += `:nth-of-type(${sibs.indexOf(cur) + 1})`;
    }
    parts.unshift(sel);
    cur = parent;
  }
  return parts.join(" > ");
}
const textSnippet = (el) => (((el.innerText || el.textContent) || "").trim().replace(/\s+/g, " ")).slice(0, 160);
// human-review style anchor: surrounding text so the agent can find the quote.
function makeAnchor(el, doc, quote) {
  let prefix = "", suffix = "";
  try {
    const scope = (el.closest && el.closest("section, header, footer, main, nav, article, body")) || doc.body;
    const full = ((scope.innerText || scope.textContent) || "").trim().replace(/\s+/g, " ");
    const head = quote.slice(0, 60);
    const i = head ? full.indexOf(head) : -1;
    if (i >= 0) {
      prefix = full.slice(Math.max(0, i - 80), i);
      suffix = full.slice(i + head.length, i + head.length + 80);
    } else {
      const ps = el.previousElementSibling;
      const ns = el.nextElementSibling;
      if (ps) prefix = (((ps.innerText || ps.textContent) || "").trim().replace(/\s+/g, " ")).slice(-80);
      if (ns) suffix = (((ns.innerText || ns.textContent) || "").trim().replace(/\s+/g, " ")).slice(0, 80);
    }
  } catch {}
  return { prefix, quote, suffix };
}
// Source location via React fiber (dev builds). React 18 exposes
// fiber._debugSource (file/line); React 19 removed it, so fall back to the
// composite-owner stack (component names, innermost first).
function reactSource(el) {
  const out = {};
  try {
    const key = Object.keys(el).find((k) => k.indexOf("__reactFiber$") === 0);
    if (!key) return out;
    const stack = [];
    let fiber = el[key], depth = 0;
    while (fiber && depth++ < 30) {
      const src = fiber._debugSource;
      if (src && src.fileName && !out.file) {
        let f = String(src.fileName);
        const i = f.lastIndexOf("/src/");
        if (i >= 0) f = f.slice(i + 1); // repo-relative: src/components/Navbar.tsx
        out.file = f; out.line = src.lineNumber || null; out.column = src.columnNumber || null;
      }
      const t = fiber.type;
      if (t && typeof t !== "string") {
        const name = t.displayName || t.name;
        if (name && stack.indexOf(name) < 0) stack.push(name);
      }
      fiber = fiber.return;
    }
    if (stack.length) { out.component = stack[0]; out.componentStack = stack; }
  } catch {}
  return out;
}
// Human where: landmark chain + nearest heading.
function locate(el, doc) {
  let section = "", heading = "";
  try {
    const marks = [];
    let cur = el;
    while (cur && cur !== doc.body && marks.length < 3) {
      const tag = (cur.tagName || "").toLowerCase();
      if (tag === "header" || tag === "nav" || tag === "main" || tag === "footer" || tag === "aside") {
        let label = tag;
        const al = cur.getAttribute && cur.getAttribute("aria-label");
        if (al) label += ` "${al}"`;
        marks.unshift(label);
      }
      cur = cur.parentElement;
    }
    section = marks.join(" > ");
    const scope = (el.closest && el.closest("section, header, footer, main, nav")) || doc;
    let h = scope.querySelector("h1, h2, h3");
    if (!h) h = doc.querySelector("h1"); // header/footer clicks → page title heading
    if (h) heading = ((h.innerText || h.textContent) || "").trim().replace(/\s+/g, " ").slice(0, 120);
  } catch {}
  return { section, heading };
}

let hl = null;
let picking = false;
let current = null;

function frameDoc() {
  try { return view.contentDocument; } catch { return null; }
}
function setFrameCursor(cur) {
  const doc = frameDoc();
  if (!doc) return;
  const root = doc.documentElement;
  if (root) root.style.cursor = cur;
  if (doc.body) doc.body.style.cursor = cur;
}
function showBox(el) {
  const doc = frameDoc();
  if (!doc || !doc.body) return;
  if (!hl || !doc.body.contains(hl)) {
    hl = doc.createElement("div");
    Object.assign(hl.style, { position: "fixed", pointerEvents: "none", zIndex: 2147483646,
      outline: "2px solid #0071e3", background: "rgba(0,113,227,.1)", display: "none" });
    doc.body.appendChild(hl);
  }
  const r = el.getBoundingClientRect();
  Object.assign(hl.style, { display: "block", left: r.left + "px", top: r.top + "px",
    width: r.width + "px", height: r.height + "px" });
}
function hideBox() { if (hl) hl.style.display = "none"; }

function attachFrame() {
  const doc = frameDoc();
  if (!doc || !doc.body) return; // polled again below until body exists
  if (doc.__auditHooked) return;
  doc.__auditHooked = true;
  if (picking) setFrameCursor("crosshair");
  doc.addEventListener("mousemove", (e) => {
    if (!picking) return;
    if (isElem(e.target)) showBox(e.target);
  }, true);
  doc.addEventListener("click", (e) => {
    if (!picking) return;
    e.preventDefault(); e.stopPropagation();
    const t = e.target;
    if (!isElem(t)) return;
    let page = target, path = "/";
    try { page = doc.location.href;
      // doc.location is the proxied URL (/p/<b64-target>/<real-path>)
      // — strip the proxy prefix so notes group under the real site path.
      path = doc.location.pathname.replace(/^\/p\/[^/]+/, "") || "/";
    } catch {}
    const src = reactSource(t);
    const loc = locate(t, doc);
    let pageTitle = "";
    try { pageTitle = doc.title || ""; } catch {}
    const quote = textSnippet(t).slice(0, 200);
    current = { id: uid(), url: page, path, page: target + path,
      kind: "element", quote, anchor: makeAnchor(t, doc, quote),
      selector: cssPath(t, doc),
      tag: (t.tagName || "el").toLowerCase(), text: textSnippet(t),
      pageTitle, section: loc.section, heading: loc.heading,
      file: src.file || null, line: src.line || null, column: src.column || null,
      component: src.component || null, componentStack: src.componentStack || null,
      viewport: `${view.clientWidth}x${view.clientHeight}`,
      createdAt: new Date().toISOString() };
    setPick(false); // one pick per activation — avoids accidental overwrites
    $("#editor").classList.add("show");
    $("#eText").value = "";
    $("#eText").focus();
  }, true);
}
// iframe load fires once; SPA shells / slow bodies need polling too.
view.addEventListener("load", () => {
  $("#warn").style.display = "none";
  attachFrame();
  let tries = 0;
  const iv = setInterval(() => {
    const doc = frameDoc();
    if ((doc && doc.body && doc.__auditHooked) || ++tries > 40) { clearInterval(iv); return; }
    attachFrame();
  }, 250);
});
view.addEventListener("error", () => {
  $("#warn").style.display = "block";
  $("#warn").textContent = "Couldn't load that address — check it and press Go.";
});

function setPick(on) {
  picking = on;
  $("#pickBtn").classList.toggle("on", on);
  $("#pickHint").classList.toggle("show", on);
  setFrameCursor(on ? "crosshair" : "");
  if (!on) hideBox();
}
$("#pickBtn").onclick = () => setPick(!picking);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setPick(false); });

$("#eCancel").onclick = () => { current = null; $("#editor").classList.remove("show"); };
$("#eSave").onclick = () => {
  if (!current) return;
  const comment = $("#eText").value.trim();
  if (!comment) { $("#eText").focus(); return; }
  current.comment = comment;
  current.severity = $("#eSev").value;
  notes.push(current);
  current = null;
  $("#editor").classList.remove("show");
  persist(); render();
  toast("Note added.");
};

function render() {
  const box = $("#pills");
  box.innerHTML = "";
  notes.forEach((n, i) => {
    const d = document.createElement("div");
    d.className = "pill glass";
    d.title = n.comment || "";
    const line = document.createElement("div");
    line.className = "line";
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = SEV_COLOR[n.severity] || SEV_COLOR.ui;
    const txt = document.createElement("span");
    txt.className = "txt"; txt.textContent = n.comment || "";
    const x = document.createElement("button");
    x.className = "x"; x.textContent = "×"; x.title = "Delete this note";
    x.onclick = (e) => { e.stopPropagation(); notes.splice(i, 1); persist(); render(); };
    line.append(dot, txt, x);
    const full = document.createElement("div");
    full.className = "full"; full.textContent = n.comment || "";
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${SEV_NAME[n.severity] || "Note"} · ${n.path || ""}${n.file ? ` · ${n.file}${n.line ? ":" + n.line : ""}` : (n.component ? ` · <${n.component}>` : "")}${n.section ? ` · ${n.section}` : ""}`;
    d.append(line, full, meta);
    d.onclick = () => d.classList.toggle("open");
    box.appendChild(d);
  });
}

// --- rail wiring ---
let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}
// human-review inspired batch: grouped by page, quote + anchor per comment.
function feedbackBatch() {
  const groups = {};
  notes.forEach((n) => {
    const key = n.page || n.path || n.url;
    (groups[key] ||= { url: n.page || "", path: n.path || "",
      pageTitle: n.pageTitle || "", comments: [] });
    const g = groups[key];
    if (!g.pageTitle && n.pageTitle) g.pageTitle = n.pageTitle;
    const c = { id: n.id, kind: n.kind || "element",
      quote: n.quote || n.text || "",
      anchor: n.anchor || { prefix: "", quote: n.quote || n.text || "", suffix: "" },
      feedback: n.comment || "" };
    if (n.severity && n.severity !== "ui") c.severity = n.severity;
    if (n.component) c.component = n.component;
    if (n.file) { c.file = n.file; if (n.line) c.line = n.line; }
    if (n.section) c.section = n.section;
    if (n.heading) c.heading = n.heading;
    c.selector = n.selector;
    g.comments.push(c);
  });
  return { status: "feedback", pages: Object.values(groups) };
}
async function copyNotes() {
  const out = JSON.stringify(feedbackBatch(), null, 2);
  try { await navigator.clipboard.writeText(out); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = out; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast("Copied — notes cleared.");
  notes = [];
  persist(); render();
}
$("#copyBtn").onclick = copyNotes;
function clearPage() {
  const doc = frameDoc();
  let href = null;
  try { href = doc && doc.location.href; } catch {}
  notes = href ? notes.filter((n) => n.url !== href) : notes;
  persist(); render();
}
$("#clearBtn").onclick = clearPage;

render();
load(target);
</script>
</body>
</html>
